    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { fill-opacity: 0; } }
    .on { animation: pulse 3.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { fill-opacity: 1; } 50% { fill-opacity: .72; } }
    @media (prefers-reduced-motion: reduce) { .in, .bar, .cursor, .on { animation: none; opacity: 1; transform: none; } }
