    .in { opacity: 0; animation: in .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1s .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { fill-opacity: 0; } }
    .on { animation: pulse 3.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { fill-opacity: 1; } 50% { fill-opacity: .72; } }
    @media (prefers-reduced-motion: reduce) { .in, .bar, .cursor, .on { animation: none; opacity: 1; transform: none; } }
